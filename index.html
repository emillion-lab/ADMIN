<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0B1220">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ADMIN</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B1220;--card:#141E33;--brd:#22334D;--acc:#22C3A6;--y:#F0B429;--rd:#EF4444;--mu:#8899AA;--tx:#E6EDF3}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;gap:18px}
.wrap{width:100%;max-width:380px}
h1{font-size:22px;font-weight:800;text-align:center;letter-spacing:1px;margin-bottom:4px}
.sub{font-size:13px;color:var(--mu);text-align:center;margin-bottom:26px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;font-weight:700}
input{width:100%;background:#0B1220;border:1px solid var(--brd);border-radius:10px;color:var(--tx);
  padding:14px;font-size:16px;margin-bottom:10px;font-family:inherit}
input:focus{outline:none;border-color:var(--acc)}
input.pin{text-align:center;letter-spacing:8px;font-size:22px}
button{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;
  cursor:pointer;font-family:inherit;transition:transform .12s;margin-bottom:8px}
button:active{transform:scale(.97)}
button:disabled{opacity:.45}
.b-acc{background:var(--acc);color:#07131C}
.b-y{background:var(--y);color:#0B1220}
.b-gh{background:transparent;color:var(--mu);border:1px solid var(--brd);font-weight:600;font-size:13px;padding:11px}
.b-rd{background:transparent;color:var(--rd);border:1px solid #4a1f1f;font-weight:600;font-size:13px;padding:11px}
.msg{font-size:13px;line-height:1.55;padding:12px 14px;border-radius:10px;margin-bottom:12px;display:none}
.msg.on{display:block}
.msg.err{background:rgba(239,68,68,.12);color:#FCA5A5;border:1px solid rgba(239,68,68,.3)}
.msg.ok{background:rgba(34,195,166,.12);color:#7EE7D2;border:1px solid rgba(34,195,166,.3)}
.msg.warn{background:rgba(240,180,41,.12);color:#F5CE72;border:1px solid rgba(240,180,41,.3)}
.step{display:none}
.step.on{display:block}
.dots{display:flex;justify-content:center;gap:8px;margin:18px 0 22px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--brd);transition:all .25s}
.dot.fill{background:var(--acc);transform:scale(1.25)}
.fp{font-size:54px;text-align:center;margin:10px 0 18px;opacity:.85}
.fp.pulse{animation:fp 1.6s ease-in-out infinite}
@keyframes fp{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.foot{font-size:11px;color:#3d4a5c;text-align:center;line-height:1.6;margin-top:8px}
.shake{animation:sh .38s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(9px)}40%{transform:translateX(-8px)}60%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
</style>
</head>
<body>
<div class="wrap">

  <h1>🔒 ADMIN</h1>
  <div class="sub" id="sub">fish.taxi · административен вход</div>

  <div class="msg" id="msg"></div>

  <!-- ══ ЗАКЛЮЧЕН ══ -->
  <div class="step" id="stLock">
    <div class="fp pulse" id="fpIcon">👆</div>
    <button class="b-acc" id="btnBio">Отключи с отпечатък</button>
    <button class="b-gh" id="btnPinOnly">Вход само с PIN</button>
  </div>

  <!-- ══ PIN ══ -->
  <div class="step" id="stPin">
    <div class="card">
      <h2 id="pinLabel">Въведи PIN</h2>
      <div class="dots" id="dots"></div>
      <input class="pin" id="inPin" type="password" inputmode="numeric" autocomplete="off"
             maxlength="12" placeholder="••••••">
      <button class="b-acc" id="btnPin">Продължи</button>
      <button class="b-gh" id="btnPinBack">Назад</button>
    </div>
  </div>

  <!-- ══ ОТКЛЮЧЕНО ══ -->
  <div class="step" id="stOpen">
    <div class="card">
      <h2>Готово</h2>
      <button class="b-acc" id="btnGo">📋 Копирай токена и отвори панела</button>
      <button class="b-gh" id="btnCopy">Само копирай токена</button>
    </div>
    <button class="b-rd" id="btnWipe">🗑 Изтрий всичко от този телефон</button>
  </div>

  <!-- ══ ПЪРВОНАЧАЛНА НАСТРОЙКА ══ -->
  <div class="step" id="stSetup">
    <div class="card">
      <h2>Първоначална настройка</h2>
      <div style="font-size:13px;color:var(--mu);line-height:1.6;margin-bottom:16px">
        Този телефон става единственият, който отваря панела.
        Отпечатъкът се връзва за хардуера му и не се копира никъде.
      </div>
      <input id="setToken" type="password" placeholder="Admin token (fta_…)" autocomplete="off">
      <input id="setPin" class="pin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN (мин. 6)">
      <input id="setPin2" class="pin" type="password" inputmode="numeric" maxlength="12" placeholder="Повтори PIN">
      <button class="b-y" id="btnSetup">Заключи на този телефон</button>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ADMIN gate — fish.taxi

   Какво пази какво:
   • Истинската ключалка е admin токенът, който mvr-proxy проверява.
     Всичко тук е слой удобство и защита при откраднат телефон.
   • Токенът НЕ седи в чист вид никъде. Държи се AES-GCM криптиран,
     ключът се извлича от PIN-а с PBKDF2 (300 000 обиколки, SHA-256).
     Открадне ли някой localStorage-а, получава шифрован блоб.
   • Отпечатъкът е WebAuthn platform credential — частният ключ живее
     в защитения елемент на телефона и не напуска устройството.
     Затова „само аз" е вярно за отпечатъка, не за PIN-а.
   • В този файл няма нито един секрет. Репото е публично нарочно —
     който го намери, вижда заключен екран и нищо повече.
   • 5 грешни PIN-а трият блоба. По-добре ново вписване, отколкото
     телефон, който някой изчаква да налучка.
   ═══════════════════════════════════════════════════════════════════ */

const PANEL = 'https://mvr-proxy.mihov-emil.workers.dev/admin';
const K = { cred:'adm_cred', salt:'adm_salt', iv:'adm_iv', blob:'adm_blob', fails:'adm_fails' };
const MAX_FAILS = 5;
const ITER = 300000;

let TOKEN = null;      // само в паметта, докато табът е отворен
let bioPassed = false;

const $ = id => document.getElementById(id);
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function show(step){
  ['stLock','stPin','stOpen','stSetup'].forEach(s => $(s).classList.toggle('on', s === step));
}
function msg(text, kind){
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg on ' + (kind || '');
  if(!text) m.className = 'msg';
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

function drawDots(n){
  const d = $('dots');
  d.innerHTML = '';
  for(let i=0;i<8;i++){
    const s = document.createElement('div');
    s.className = 'dot' + (i < n ? ' fill' : '');
    d.appendChild(s);
  }
}
$('inPin').addEventListener('input', e => drawDots(e.target.value.length));
drawDots(0);

/* ─── крипто ─── */
async function keyFromPin(pin, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function sealToken(token, pin){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await keyFromPin(pin, salt);
  const ct   = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key,
                 new TextEncoder().encode(token));
  localStorage.setItem(K.salt, b64(salt));
  localStorage.setItem(K.iv,   b64(iv));
  localStorage.setItem(K.blob, b64(ct));
  localStorage.removeItem(K.fails);
}
async function openToken(pin){
  const salt = unb64(localStorage.getItem(K.salt));
  const iv   = unb64(localStorage.getItem(K.iv));
  const ct   = unb64(localStorage.getItem(K.blob));
  const key  = await keyFromPin(pin, salt);
  /* Грешен PIN → AES-GCM се проваля при проверката на тага.
     Затова няма нужда от отделен „хеш на PIN-а" — самият шифър е тестът. */
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}

/* ─── WebAuthn ─── */
async function registerBio(){
  if(!window.PublicKeyCredential) return null;
  try{
    const cred = await navigator.credentials.create({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name:'fish.taxi ADMIN' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)),
              name:'admin', displayName:'fish.taxi admin' },
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform',
                                userVerification:'required', residentKey:'preferred' },
      timeout: 60000, attestation:'none'
    }});
    localStorage.setItem(K.cred, b64(cred.rawId));
    return true;
  }catch(e){ return null; }
}
async function verifyBio(){
  const id = localStorage.getItem(K.cred);
  if(!id || !window.PublicKeyCredential) return false;
  try{
    await navigator.credentials.get({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type:'public-key', id: unb64(id) }],
      userVerification:'required', timeout: 60000
    }});
    return true;
  }catch(e){ return false; }
}

/* ─── брояч на грешките ─── */
function fails(){ return parseInt(localStorage.getItem(K.fails) || '0', 10); }
function bumpFail(){
  const n = fails() + 1;
  localStorage.setItem(K.fails, String(n));
  if(n >= MAX_FAILS){ wipe(); return true; }
  return false;
}
function wipe(){
  Object.values(K).forEach(k => localStorage.removeItem(k));
  TOKEN = null; bioPassed = false;
  msg('Данните са изтрити от този телефон. Настрой отначало.', 'warn');
  show('stSetup');
  $('foot').textContent = '';
}

/* ─── стъпки ─── */
function isSetUp(){ return !!localStorage.getItem(K.blob); }

$('btnBio').onclick = async () => {
  msg('', '');
  $('fpIcon').textContent = '👆';
  const ok = await verifyBio();
  if(ok){ bioPassed = true; goPin('Потвърди с PIN'); }
  else { msg('Отпечатъкът не бе разпознат. Може да влезеш само с PIN.', 'err'); }
};
$('btnPinOnly').onclick = () => goPin('Въведи PIN');
$('btnPinBack').onclick = () => { $('inPin').value=''; drawDots(0); msg('',''); show('stLock'); };

function goPin(label){
  $('pinLabel').textContent = label;
  $('inPin').value = ''; drawDots(0);
  show('stPin');
  setTimeout(()=>$('inPin').focus(), 120);
  const left = MAX_FAILS - fails();
  $('foot').textContent = left < MAX_FAILS ? ('Остават ' + left + ' опита преди изтриване.') : '';
}

$('btnPin').onclick = async () => {
  const pin = $('inPin').value.trim();
  if(pin.length < 6){ shake($('inPin')); return; }
  $('btnPin').disabled = true;
  msg('Отключване…', '');
  try{
    TOKEN = await openToken(pin);
    localStorage.removeItem(K.fails);
    msg('', '');
    $('sub').textContent = 'Отключено · токенът е само в паметта на този таб';
    show('stOpen');
    $('foot').textContent = 'Затвориш ли таба, токенът изчезва от паметта.';
  }catch(e){
    const wiped = bumpFail();
    if(!wiped){
      shake($('inPin'));
      msg('Грешен PIN. Остават ' + (MAX_FAILS - fails()) + ' опита.', 'err');
      $('inPin').value = ''; drawDots(0);
    }
  }
  $('btnPin').disabled = false;
};

async function copyToken(){
  try{ await navigator.clipboard.writeText(TOKEN); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = TOKEN; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta);
    return true;
  }
}
$('btnCopy').onclick = async () => {
  await copyToken();
  msg('Токенът е в клипборда.', 'ok');
};
$('btnGo').onclick = async () => {
  await copyToken();
  /* Токенът се предава през клипборда, не през URL: адресът остава в
     историята на браузъра, а фрагментът — в back-стека. Един paste е
     по-евтин от токен, който се влачи в лентата. */
  window.open(PANEL, '_blank', 'noopener');
  msg('Панелът е отворен. Постави токена в полето за парола.', 'ok');
};
$('btnWipe').onclick = () => {
  if(confirm('Изтриване на токена и отпечатъка от този телефон?')) wipe();
};

$('btnSetup').onclick = async () => {
  const t = $('setToken').value.trim();
  const p1 = $('setPin').value.trim(), p2 = $('setPin2').value.trim();
  if(!t){ shake($('setToken')); msg('Въведи admin токена.', 'err'); return; }
  if(p1.length < 6){ shake($('setPin')); msg('PIN-ът е минимум 6 цифри.', 'err'); return; }
  if(p1 !== p2){ shake($('setPin2')); msg('PIN-овете не съвпадат.', 'err'); return; }

  $('btnSetup').disabled = true;
  msg('Свързване с отпечатъка…', '');
  const bio = await registerBio();
  msg('Заключване…', '');
  await sealToken(t, p1);
  $('setToken').value = ''; $('setPin').value = ''; $('setPin2').value = '';
  $('btnSetup').disabled = false;
  msg(bio ? 'Готово. Отпечатъкът е свързан с този телефон.'
          : 'Готово. Отпечатък не е наличен — влиза се с PIN.', 'ok');
  show('stLock');
  $('btnBio').style.display = bio ? 'block' : 'none';
};

/* ─── старт ─── */
(function init(){
  if(!isSetUp()){
    show('stSetup');
    $('sub').textContent = 'Първо отваряне на този телефон';
    return;
  }
  show('stLock');
  $('btnBio').style.display = localStorage.getItem(K.cred) ? 'block' : 'none';
  const left = MAX_FAILS - fails();
  if(left < MAX_FAILS) $('foot').textContent = 'Остават ' + left + ' опита преди изтриване.';
})();
</script>
</body>
</html>
